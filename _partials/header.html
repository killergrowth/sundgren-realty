<!-- Main Nav -->
<header class="site-header" id="site-header">
  <!-- Yellow logo badge — hangs below the nav bar -->
  <a href="/" class="logo-badge" aria-label="Sundgren Realty Home">
    <div class="logo-badge-inner">
      <img src="/images/sundgren-symbol-black.png" alt="" class="logo-badge-symbol" aria-hidden="true">
      <div class="logo-badge-text">
        <span class="logo-badge-name">Sundgren</span>
        <span class="logo-badge-sub">Realty</span>
      </div>
    </div>
  </a>
  <div class="nav-inner">
    <div class="logo-spacer"></div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      &#9776;
    </button>
    <ul class="main-nav" id="main-nav">
      <li id="nav-home-link"><a href="/">Home</a></li>
      <li class="has-dropdown">
        <a href="/listings/">Listings</a>
        <ul class="nav-dropdown">
          <li><a href="/listings/">All Listings</a></li>
          <li><a href="/commercial/">Commercial</a></li>
          <li><a href="/residential/">Residential</a></li>
          <li><a href="/land-listings/">Land</a></li>
          <li><a href="/property-search/">Search</a></li>
        </ul>
      </li>
      <li><a href="/auctions/">Auctions</a></li>
      <li><a href="/agents/">Agents</a></li>
      <li><a href="/news/">News</a></li>
      <li class="contact-btn"><a href="/contact-us/">Contact Us</a></li>
    </ul>
  </div>
</header>

<script>
(function(){
  var btn = document.getElementById('nav-toggle');
  var nav = document.getElementById('main-nav');
  if (btn && nav) {
    btn.addEventListener('click', function() {
      var open = nav.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
    });
  }
  // Hide Home link on homepage
  var homeLink = document.getElementById('nav-home-link');
  if (homeLink && window.location.pathname === '/') homeLink.style.display = 'none';

  // Mobile dropdown toggle (tap the top-level Listings link)
  document.querySelectorAll('.main-nav li.has-dropdown > a').forEach(function(a) {
    a.addEventListener('click', function(e) {
      // Only intercept on mobile (nav is stacked)
      if (window.innerWidth <= 900) {
        e.preventDefault();
        a.parentElement.classList.toggle('open');
      }
    });
  });
  // Highlight active nav item
  var path = window.location.pathname;
  document.querySelectorAll('.main-nav li a, .nav-dropdown li a').forEach(function(a) {
    if (a.hostname === window.location.hostname && path !== '/' && a.getAttribute('href') && a.getAttribute('href') !== '/' && path.startsWith(a.getAttribute('href'))) {
      a.classList.add('active');
      // Also mark parent dropdown item active
      var parent = a.closest('.has-dropdown');
      if (parent) parent.querySelector(':scope > a').classList.add('active');
    }
  });
})();
</script>
