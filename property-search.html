  <meta property="og:title" content="Property Search | Sundgren Realty &amp; Auction | El Dorado, KS">
  <meta property="og:description" content="Search residential homes and real estate listings across South Central Kansas.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sundgrenrealty.com/property-search/">
  <meta property="og:site_name" content="Sundgren Realty &amp; Auction">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:image" content="https://sundgren-realty.pages.dev/images/og-preview.png">
  <meta property="og:image:secure_url" content="https://sundgren-realty.pages.dev/images/og-preview.png">
  <meta property="og:image:width" content="1536">
  <meta property="og:image:height" content="1024">
  <meta name="twitter:image" content="https://sundgren-realty.pages.dev/images/og-preview.png">

  <link rel="icon" href="/images/sun-favicon-dark.png" type="image/png" media="(prefers-color-scheme: light)">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/sundgren.css">
  <style>
    .idx-widget-wrap { background: #fff; padding: 40px 0 60px; }
    .idx-widget-wrap .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .idx-map-wrap { background: var(--bg-light); padding: 0 0 60px; }
    .idx-map-wrap .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .idx-map-wrap .section-title { padding-top: 40px; }
  </style>
</head>
<body>

<!-- HEADER -->

<main>

  <section class="page-hero">
    <div class="inner">
      <h1>Property Search</h1>
      <nav aria-label="Breadcrumb">
        <ol class="breadcrumb">
          <li><a href="/">Home</a></li>
          <li class="active">Property Search</li>
        </ol>
      </nav>
    </div>
  </section>

  <!-- IDX AI Smart Search -->
  <section class="section" style="padding-bottom:20px;background:var(--bg-light);">
    <div class="container">
      <div class="idx-search-page-wrap" id="idx-search-container">
        <div id="idx-search-placeholder" style="min-height:80px;"></div>
      </div>
    </div>
  </section>

  <!-- IDX Listings Showcase - Residential -->
  <div class="idx-widget-wrap">
    <div class="container" id="idx-residential-container">
      <div id="idx-residential-placeholder" style="min-height:300px;display:flex;align-items:center;justify-content:center;">
        <span style="color:#aaa;font-size:14px;">Loading listings&hellip;</span>
      </div>
    </div>
  </div>

  <!-- IDX Map Search -->
  <div class="idx-map-wrap">
    <div class="container" id="idx-map-container">
      <div id="idx-map-placeholder" style="min-height:300px;display:flex;align-items:center;justify-content:center;">
        <span style="color:#aaa;font-size:14px;">Loading map&hellip;</span>
      </div>
    </div>
  </div>

  <script>
  (function(){
    function loadWidget(containerId, placeholderId, widgetId, widgetSrc){
      var container = document.getElementById(containerId);
      var placeholder = document.getElementById(placeholderId);
      if (!container || container.dataset.loaded) return;
      container.dataset.loaded = '1';
      if (placeholder) placeholder.remove();
      var s = document.createElement('script');
      s.charset = 'UTF-8'; s.type = 'text/javascript';
      s.id = widgetId; s.src = widgetSrc;
      container.appendChild(s);
    }
    var widgets = [
      ['idx-search-container',     'idx-search-placeholder',      'idxwidgetsrc-166177', '//realestate.sundgren.com/idx/widgets/166177'],
      ['idx-residential-container','idx-residential-placeholder',  'idxwidgetsrc-166188', '//realestate.sundgren.com/idx/widgets/166188'],
      ['idx-map-container',        'idx-map-placeholder',          'idxwidgetsrc-166193', '//realestate.sundgren.com/idx/widgets/166193'],
    ];
    if ('IntersectionObserver' in window) {
      widgets.forEach(function(w){
        var el = document.getElementById(w[0]);
        if (!el) return;
        var obs = new IntersectionObserver(function(entries, o){
          if (entries[0].isIntersecting) { loadWidget(w[0],w[1],w[2],w[3]); o.disconnect(); }
        }, { rootMargin: '200px' });
        obs.observe(el);
      });
    } else {
      window.addEventListener('load', function(){
        widgets.forEach(function(w){ loadWidget(w[0],w[1],w[2],w[3]); });
      });
    }
    // Poll all idx-listings-showcase shadow roots and hide headers
    var hideAttempts = 0;
    var hidePoller = setInterval(function() {
      document.querySelectorAll('idx-listings-showcase').forEach(function(el) {
        if (el.shadowRoot) {
          var hdr = el.shadowRoot.querySelector('.idx-listings-showcase__header');
          if (hdr) hdr.style.display = 'none';
        }
      });
      if (++hideAttempts > 60) clearInterval(hidePoller);
    }, 250);
  })();
  </script>

  <section class="cta-dark">
    <div class="container">
      <h2>Ready to Find Your Home?</h2>
      <p>Our experienced agents know South Central Kansas inside and out. Let us help you find the right property at the right price.</p>
      <a href="/contact-us/" class="btn-yellow">Talk to an Agent</a>
      <a href="/land-listings/" class="btn-outline-white">Browse Land Listings</a>
    </div>
  </section>

</main>

<!-- FOOTER -->

</body>
</html>
