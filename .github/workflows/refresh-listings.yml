name: Refresh Listings

on:
  schedule:
    # Every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch fresh listings from Repliers API
        run: node generate-repliers-listings.mjs
        env:
          REPLIERS_API_KEY: ${{ secrets.REPLIERS_API_KEY }}

      - name: Build full site
        run: node build.js

      - name: Sync all-listings.json prices from Repliers data
        # Repliers is the authoritative price source. Merge fresh prices into
        # all-listings.json so the grid index always reflects current MLS prices.
        run: |
          node -e "
          const fs = require('fs');
          const repliers = JSON.parse(fs.readFileSync('data/repliers-listings.json','utf8'));
          const all = JSON.parse(fs.readFileSync('data/all-listings.json','utf8'));
          const map = {};
          for (const l of repliers) { if (l.mlsNumber) map[l.mlsNumber] = l; }
          let n = 0;
          for (const l of all) {
            const r = map[l.mlsNumber];
            if (r && r.price !== l.price) {
              // Track price reduction: only set previousPrice when price drops
              if (r.price < l.price && l.price > 0) {
                l.previousPrice = l.price;
              } else {
                // Price went up or unchanged direction — clear previousPrice
                delete l.previousPrice;
              }
              l.price = r.price;
              n++;
            }
          }
          fs.writeFileSync('data/all-listings.json', JSON.stringify(all, null, 2), 'utf8');
          console.log('Synced', n, 'prices');
          "

      - name: Rebuild listing index pages (must run AFTER build.js)
        # build.js copies listings/index.html from source — overwriting the fresh
        # index built by the generator. These scripts write directly to dist/ and
        # must run last so card prices/status always match the live Repliers data.
        run: |
          node build-listings-index.mjs
          node build-type-index-pages.mjs
          node build-property-search.mjs

      - name: Deploy to Cloudflare Pages (staging)
        run: npx wrangler pages deploy ./dist --project-name sundgren-realty --branch staging --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 27cafbbee6f8e1db0d9499405d4755c1

      - name: Deploy to Cloudflare Pages (main)
        run: npx wrangler pages deploy ./dist --project-name sundgren-realty --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 27cafbbee6f8e1db0d9499405d4755c1

      - name: Commit updated listing data
        run: |
          git config user.name "KillerGrowth"
          git config user.email "notifications@killergrowth.com"
          git add data/repliers-listings.json data/all-listings.json listings/ listings/index.html property-search.html
          git diff --staged --quiet || git commit -m "chore: refresh listings data [skip ci]"
          git push
